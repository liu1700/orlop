# Reference mount-pod pattern for CSI/controller integrations.
#
# The controller that renders this pod must:
#   1. set nodeName and a unique host targetPath for the volume,
#   2. configure the projected workload token + agent-scoped exchange endpoint
#      below (or inject a fresh ORLOP_ENROLL_TOKEN on every process attempt),
#   3. reconcile one pod per desired mount independently of the CSI node-plugin
#      pod, and
#   4. delete/recreate this pod (not restart its consumed token) after failure.
#
# A readiness failure intentionally does NOT trigger a liveness restart. Killing
# the process that owns /dev/fuse would create the stale mount being diagnosed.
apiVersion: v1
kind: Pod
metadata:
  name: orlop-mount-AGENT_ID
  labels:
    app.kubernetes.io/name: orlop
    app.kubernetes.io/component: mount
    orlop.dev/agent-id: AGENT_ID
spec:
  nodeName: NODE_NAME
  restartPolicy: Never
  terminationGracePeriodSeconds: 30
  containers:
    - name: mount
      # Pin a release that contains `orlop mount check`; replace RELEASE_TAG
      # (or the whole reference with an immutable digest) during reconciliation.
      image: ghcr.io/liu1700/orlop-mount:RELEASE_TAG
      imagePullPolicy: IfNotPresent
      args: ["mount", "--from-env"]
      env:
        - name: ORLOP_AGENT_ID
          value: AGENT_ID
        - name: ORLOP_CONTROL_PLANE
          value: https://orlop-control.example
        - name: ORLOP_SA_TOKEN_PATH
          value: /var/run/secrets/orlop/token
        - name: ORLOP_REFRESH_URL
          value: https://YOUR_EXCHANGE_ENDPOINT/v1/agents/AGENT_ID/enroll-token
        - name: ORLOP_MOUNT_POINT
          value: /mnt/orlop
      securityContext:
        allowPrivilegeEscalation: true
        capabilities:
          add: ["SYS_ADMIN"]
      readinessProbe:
        exec:
          command: ["orlop", "mount", "check", "/mnt/orlop"]
        initialDelaySeconds: 2
        periodSeconds: 10
        timeoutSeconds: 4
        failureThreshold: 2
      lifecycle:
        preStop:
          exec:
            command: ["orlop", "unmount", "/mnt/orlop"]
      volumeMounts:
        - name: fuse
          mountPath: /dev/fuse
        - name: target
          mountPath: /mnt/orlop
          mountPropagation: Bidirectional
        - name: workload-identity
          mountPath: /var/run/secrets/orlop
          readOnly: true
  volumes:
    - name: fuse
      hostPath:
        path: /dev/fuse
        type: CharDevice
    - name: target
      hostPath:
        path: /var/lib/orlop/mounts/AGENT_ID
        type: DirectoryOrCreate
    - name: workload-identity
      projected:
        sources:
          - serviceAccountToken:
              path: token
              audience: orlop-control
              expirationSeconds: 600
