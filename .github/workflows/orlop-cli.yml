name: orlop-cli

on:
  # Runs on every PR (not path-filtered) so it can be a required status check
  # that always reports — otherwise a PR touching no Rust files would leave the
  # required `build` check stuck "Expected" and unmergeable.
  pull_request:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/orlop-cli.yml"
      - "build.rs"
      - "Cargo.toml"
      - "Cargo.lock"
      - "src/**"
      - "tests/**"

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Install musl toolchain
        run: sudo apt-get update && sudo apt-get install -y musl-tools

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-unknown-linux-musl

      - uses: Swatinem/rust-cache@v2

      - run: cargo build --locked

      # Release binaries target musl, whose libc ABI differs from glibc for
      # pthread_t and ancillary-message length fields. Build that exact target
      # on every PR so tag-only release jobs cannot discover portability bugs.
      - run: cargo build --release --locked --bin orlop --target x86_64-unknown-linux-musl

      - name: Reject accidental libfuse ABI dependency
        run: |
          if ldd target/debug/orlop | grep -q libfuse; then
            echo "orlop must use fuser's pure /dev/fuse backend" >&2
            exit 1
          fi

      - run: cargo test --locked

      - run: cargo clippy --locked --all-targets -- -D warnings

# Note: macOS builds live in release.yml (runs on tag push only). They need no
# macFUSE: `fuser` is Linux-gated in Cargo.toml, so the darwin build uses the
# in-process NFSv3 path and compiles without it. A macos job here would still
# burn ~10x billing minutes per push for little PR signal, so PR CI stays
# Linux-only on purpose.
